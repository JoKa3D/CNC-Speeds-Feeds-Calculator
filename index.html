<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Feeds&Speeds">
  <meta name="theme-color" content="#e0e5ec">
  <title>Feeds & Speeds — Micro End Mill Calculator</title>
  <style>
    :root {
      /* Theme Defaults (Neumorphism Light) */
      --ground: #e0e5ec;
      --panel: #e0e5ec;
      --shadow-out: 9px 9px 18px #a3b1c6, -9px -9px 18px #ffffff;
      --shadow-out-sm: 5px 5px 10px #a3b1c6, -5px -5px 10px #ffffff;
      --shadow-in: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
      --shadow-btn: 6px 6px 12px #a3b1c6, -6px -6px 12px #ffffff;
      --shadow-btn-active: inset 4px 4px 8px #a3b1c6, inset -4px -4px 8px #ffffff;
      --accent: #3182ce;
      --secondary: #718096;
      --warning: #dd6b20;
      --critical: #e53e3e;
      --ink: #2d3748;
      --ok: #38a169;
      --border: 1px solid transparent;
      --blur: none;

      --font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", sans-serif;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      transition: background-color 0.25s ease, color 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
    }

    body {
      background-color: var(--ground);
      color: var(--ink);
      font-family: var(--font-family);
      padding-top: max(12px, env(safe-area-inset-top));
      padding-bottom: max(80px, calc(env(safe-area-inset-bottom) + 60px));
      padding-left: max(12px, env(safe-area-inset-left));
      padding-right: max(12px, env(safe-area-inset-right));
      max-width: 600px;
      margin: 0 auto;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
    }

    /* iOS Navigation Header */
    .ios-header {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
      background: var(--panel);
      padding: 16px;
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-out);
      border: var(--border);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
    }

    .ios-title-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .app-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: var(--ink);
    }

    .header-field-inline {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-input-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--secondary);
      font-weight: 700;
    }

    .header-input-wrapper {
      display: flex;
      align-items: center;
      background: var(--ground);
      box-shadow: var(--shadow-in);
      border: var(--border);
      border-radius: var(--radius-sm);
      padding: 0 8px;
      height: 36px;
    }

    input[type="number"].header-num-input {
      background: transparent;
      border: none;
      box-shadow: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      height: 36px;
      width: 70px;
      outline: none;
      font-family: "SF Mono", ui-monospace, monospace;
      text-align: center;
    }

    /* iOS Segmented Control for Theme Picker */
    .theme-segmented-wrapper {
      width: 100%;
      background: var(--ground);
      box-shadow: var(--shadow-in);
      border: var(--border);
      border-radius: var(--radius-sm);
      padding: 4px;
      position: relative;
    }

    .theme-select {
      width: 100%;
      background: transparent;
      border: none;
      color: var(--ink);
      font-size: 13px;
      font-weight: 600;
      height: 32px;
      outline: none;
      appearance: none;
      -webkit-appearance: none;
      font-family: var(--font-family);
      padding-left: 8px;
      padding-right: 24px;
    }

    .theme-segmented-wrapper::after {
      content: "⌵";
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-weight: bold;
      color: var(--accent);
      pointer-events: none;
    }

    .theme-select option {
      background: var(--ground);
      color: var(--ink);
    }

    /* Typography */
    .num {
      font-family: "SF Mono", ui-monospace, Menlo, Consolas, monospace;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      font-weight: 700;
    }

    label, .label-style {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--secondary);
      display: block;
      margin-bottom: 6px;
      font-weight: 700;
    }

    /* Card Panels */
    .panel {
      background: var(--panel);
      box-shadow: var(--shadow-out);
      border: var(--border);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-radius: var(--radius-lg);
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 11px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--secondary);
      padding-bottom: 6px;
      margin-bottom: 12px;
      font-weight: 800;
      border-bottom: 1px solid rgba(128, 128, 128, 0.15);
    }

    /* Form Controls & Groups */
    .control-group {
      margin-bottom: 16px;
    }

    .control-header {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      margin-bottom: 6px;
    }

    /* Touch Sliders */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      background: var(--ground);
      box-shadow: var(--shadow-in);
      border: var(--border);
      border-radius: 10px;
      outline: none;
      margin: 8px 0;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      height: 28px;
      width: 28px;
      border-radius: 50%;
      background: var(--ground);
      box-shadow: var(--shadow-btn);
      cursor: pointer;
      border: 2px solid var(--accent);
      transition: transform 0.1s ease;
    }

    input[type="range"]::-webkit-slider-thumb:active {
      transform: scale(1.1);
      box-shadow: var(--shadow-btn-active);
    }

    input[type="number"] {
      width: 100%;
      height: 44px;
      background: var(--ground);
      box-shadow: var(--shadow-in);
      border: var(--border);
      border-radius: var(--radius-sm);
      color: var(--ink);
      padding: 0 12px;
      font-size: 15px;
      font-family: "SF Mono", ui-monospace, monospace;
      outline: none;
      font-weight: 600;
    }

    /* Horizontal Scroll Presets Bar */
    .preset-scroll-container {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }

    .preset-scroll-container::-webkit-scrollbar {
      display: none;
    }

    .preset-btn {
      flex: 0 0 auto;
      height: 38px;
      padding: 0 14px;
      background: var(--ground);
      box-shadow: var(--shadow-btn);
      border: var(--border);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 12px;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .preset-btn:active, .preset-btn.active {
      box-shadow: var(--shadow-btn-active);
      color: var(--accent);
      border-color: var(--accent);
    }

    /* iOS Segmented Control for Flutes */
    .flute-segmented-control {
      display: flex;
      background: var(--ground);
      box-shadow: var(--shadow-in);
      border: var(--border);
      border-radius: var(--radius-sm);
      padding: 3px;
      gap: 2px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .flute-btn {
      flex: 1;
      min-width: 32px;
      height: 36px;
      background: transparent;
      border: none;
      border-radius: 8px;
      color: var(--ink);
      font-family: "SF Mono", ui-monospace, monospace;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .flute-btn.active {
      background: var(--panel);
      box-shadow: var(--shadow-out-sm);
      color: var(--accent);
    }

    /* iOS Modal Trigger for Material */
    .material-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--ground);
      box-shadow: var(--shadow-in);
      border: var(--border);
      border-radius: var(--radius-sm);
      padding: 0 14px;
      height: 44px;
      width: 100%;
      cursor: pointer;
    }

    .material-trigger-text {
      font-size: 14px;
      font-weight: 700;
      color: var(--ink);
    }

    .material-trigger-arrow {
      color: var(--accent);
      font-weight: bold;
    }

    /* iOS Sheet Modal */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      z-index: 1000;
      display: flex;
      align-items: flex-end;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    .modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-sheet {
      width: 100%;
      max-height: 70vh;
      background: var(--panel);
      border-radius: 20px 20px 0 0;
      padding: 20px 16px max(20px, env(safe-area-inset-bottom));
      box-shadow: 0 -10px 30px rgba(0, 0, 0, 0.2);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.1, 0.9, 0.2, 1);
      overflow-y: auto;
    }

    .modal-overlay.active .modal-sheet {
      transform: translateY(0);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--ink);
    }

    .modal-close {
      background: var(--ground);
      box-shadow: var(--shadow-btn);
      border: var(--border);
      border-radius: 50%;
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--ink);
      font-weight: bold;
    }

    .material-option-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .material-option-item {
      padding: 12px 14px;
      background: var(--ground);
      box-shadow: var(--shadow-out-sm);
      border: var(--border);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-weight: 600;
      font-size: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .material-option-item.selected {
      border-color: var(--accent);
      color: var(--accent);
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      min-height: 44px;
      gap: 12px;
      cursor: pointer;
      background: var(--ground);
      box-shadow: var(--shadow-in);
      border: var(--border);
      border-radius: var(--radius-sm);
      padding: 0 14px;
    }

    .checkbox-group input {
      width: 20px;
      height: 20px;
      accent-color: var(--accent);
      cursor: pointer;
    }

    .checkbox-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--ink);
      font-weight: 700;
    }

    /* Gauge Card */
    .gauge-card {
      background: var(--ground);
      box-shadow: var(--shadow-out-sm);
      border: var(--border);
      border-radius: var(--radius-md);
      padding: 16px;
      margin-bottom: 16px;
    }

    .gauge-bar-wrap {
      position: relative;
      height: 14px;
      background: var(--ground);
      box-shadow: var(--shadow-in);
      border: var(--border);
      border-radius: 10px;
      margin: 12px 0 8px 0;
      display: flex;
      overflow: hidden;
      padding: 2px;
    }

    .gauge-zone-rub { width: 10%; background: var(--critical); opacity: 0.8; border-radius: 6px 0 0 6px; }
    .gauge-zone-cut { width: 56.6%; background: var(--ok); opacity: 0.8; }
    .gauge-zone-break { width: 33.4%; background: var(--critical); opacity: 0.8; border-radius: 0 6px 6px 0; }

    .gauge-needle {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 6px;
      background: var(--ink);
      border-radius: 4px;
      box-shadow: 0 0 6px rgba(0,0,0,0.5);
      transition: left 0.15s ease-out;
      transform: translateX(-50%);
    }

    /* iOS Data Tables */
    .data-table {
      width: 100%;
      border-collapse: separate;
      border-spacing: 0 6px;
      margin-bottom: 16px;
      font-size: 13px;
    }

    .data-table th {
      color: var(--secondary);
      font-weight: 700;
      font-size: 10px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      padding: 4px 8px;
      text-align: left;
    }

    .data-table td {
      background: var(--ground);
      box-shadow: var(--shadow-out-sm);
      border: var(--border);
      padding: 10px 8px;
      text-align: left;
    }

    .data-table tr td:first-child {
      border-radius: var(--radius-sm) 0 0 var(--radius-sm);
    }

    .data-table tr td:last-child {
      border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
    }

    .secondary-feeds-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 16px;
    }

    .feed-card {
      background: var(--ground);
      box-shadow: var(--shadow-out-sm);
      border: var(--border);
      border-radius: var(--radius-sm);
      padding: 12px;
    }

    /* Checks Section */
    .check-item {
      padding: 10px 14px;
      margin-bottom: 8px;
      font-size: 12px;
      line-height: 1.4;
      border-radius: var(--radius-sm);
      background: var(--ground);
      box-shadow: var(--shadow-in);
      border: var(--border);
      font-weight: 600;
    }

    .check-item.critical { color: var(--critical); }
    .check-item.warning { color: var(--warning); }
    .check-item.ok { color: var(--ok); }

    .note-text {
      font-size: 11px;
      color: var(--secondary);
      margin-top: 6px;
      line-height: 1.3;
      font-weight: 500;
    }

    .form-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* iOS Sticky Bottom Toolbar */
    .ios-toolbar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--panel);
      backdrop-filter: var(--blur);
      -webkit-backdrop-filter: var(--blur);
      border-top: var(--border);
      box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
      padding: 10px 16px max(10px, env(safe-area-inset-bottom));
      display: flex;
      gap: 12px;
      z-index: 999;
      justify-content: center;
    }

    .ios-toolbar-inner {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 12px;
    }

    .btn-action {
      flex: 1;
      background: var(--ground);
      box-shadow: var(--shadow-btn);
      border: var(--border);
      border-radius: var(--radius-sm);
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.05em;
      height: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      outline: none;
    }

    .btn-action:active {
      box-shadow: var(--shadow-btn-active);
    }

    .btn-accent {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <!-- iOS Header Title Bar -->
  <header class="ios-header">
    <div class="ios-title-bar">
      <div class="app-title">Feeds & Speeds</div>
      <div class="header-field-inline">
        <label for="inp_maxSpindle" class="header-input-label" data-i18n="max_spindle">MAX U/MIN:</label>
        <div class="header-input-wrapper">
          <input type="number" id="inp_maxSpindle" value="18000" min="1000" max="100000" step="500" class="header-num-input">
        </div>
      </div>
    </div>
    
    <!-- iOS Theme Picker Segmented Bar -->
    <div class="theme-segmented-wrapper">
      <select id="themeSelector" class="theme-select" onchange="applyTheme(this.value)"></select>
    </div>
  </header>

  <!-- INPUTS PANEL -->
  <section class="panel">
    <div class="section-title" data-i18n="tool_material">Werkzeug & Werkstoff</div>

    <!-- Tool Presets -->
    <div class="control-group">
      <label data-i18n="presets">Tool Presets</label>
      <div class="preset-scroll-container" id="presetGrid">
        <button class="preset-btn" data-dia="0.5" data-flutes="1" onclick="applyPreset(0.5, 1)">Ø0.5·1Z</button>
        <button class="preset-btn" data-dia="0.6" data-flutes="2" onclick="applyPreset(0.6, 2)">Ø0.6·2Z</button>
        <button class="preset-btn" data-dia="0.8" data-flutes="2" onclick="applyPreset(0.8, 2)">Ø0.8·2Z</button>
        <button class="preset-btn" data-dia="1.0" data-flutes="2" onclick="applyPreset(1.0, 2)">Ø1.0·2Z</button>
        <button class="preset-btn" data-dia="2.0" data-flutes="2" onclick="applyPreset(2.0, 2)">Ø2.0·2Z</button>
      </div>
    </div>

    <!-- Tool Diameter -->
    <div class="control-group">
      <div class="control-header">
        <label data-i18n="tool_dia">Fräserdurchmesser (D)</label>
        <span class="num" id="val_toolDia" style="font-size: 15px;">0.60 mm</span>
      </div>
      <input type="range" id="inp_toolDia" min="0.1" max="16.0" step="0.1" value="0.6">
    </div>

    <!-- Flutes (Z) iOS Segmented Control -->
    <div class="control-group">
      <label data-i18n="flutes">Schneidenanzahl (Z)</label>
      <div class="flute-segmented-control" id="fluteGrid">
        <button class="flute-btn" onclick="setFlutes(1)">1Z</button>
        <button class="flute-btn active" onclick="setFlutes(2)">2Z</button>
        <button class="flute-btn" onclick="setFlutes(3)">3Z</button>
        <button class="flute-btn" onclick="setFlutes(4)">4Z</button>
        <button class="flute-btn" onclick="setFlutes(5)">5Z</button>
        <button class="flute-btn" onclick="setFlutes(6)">6Z</button>
        <button class="flute-btn" onclick="setFlutes(7)">7Z</button>
        <button class="flute-btn" onclick="setFlutes(8)">8Z</button>
      </div>
    </div>

    <!-- Material Select Modal Trigger -->
    <div class="control-group">
      <label data-i18n="material">Werkstoff</label>
      <div class="material-trigger" id="materialTrigger" onclick="openMaterialModal()">
        <span class="material-trigger-text" id="materialTriggerText">Brass MS58 (CuZn39Pb3)</span>
        <span class="material-trigger-arrow">›</span>
      </div>
      <div class="note-text" id="matNote">---</div>
    </div>

    <!-- Spindle Speed Slider -->
    <div class="control-group">
      <div class="control-header">
        <label data-i18n="spindle">Spindeldrehzahl (n)</label>
        <span class="num" id="val_spindle" style="font-size: 15px;">16,000 min⁻¹</span>
      </div>
      <input type="range" id="inp_spindle" min="1000" max="18000" step="500" value="16000">
      <div class="note-text" id="spindleWarn" style="display:none; color: var(--warning); font-weight:700;"></div>
    </div>

    <!-- Chip Thinning Checkbox -->
    <div class="control-group">
      <label class="checkbox-group">
        <input type="checkbox" id="inp_comp">
        <span class="checkbox-label" data-i18n="chip_thinning">Spanausdünnung kompensieren</span>
      </label>
    </div>

    <div class="section-title" style="margin-top: 20px;" data-i18n="feature_dims">Form-Geometrien</div>

    <!-- Feature Inputs -->
    <div class="form-grid-2">
      <div class="control-group">
        <label data-i18n="bore_dia">Bohrung Ø (mm)</label>
        <input type="number" id="inp_bore" value="1.00" step="0.05">
      </div>
      <div class="control-group">
        <label data-i18n="thread_dia">Gewinde Ø (mm)</label>
        <input type="number" id="inp_thread" value="2.00" step="0.05">
      </div>
      <div class="control-group">
        <label data-i18n="chamfer_w">Fasenbreite (mm)</label>
        <input type="number" id="inp_chamfer" value="0.20" step="0.05">
      </div>
      <div class="control-group">
        <label data-i18n="drill_dia">Bohrer Ø (mm)</label>
        <input type="number" id="inp_drill" value="1.00" step="0.1">
      </div>
    </div>
    <div class="control-group">
      <label data-i18n="hole_depth">Bohrtiefe (mm)</label>
      <input type="number" id="inp_depth" value="2.00" step="0.1">
    </div>
  </section>

  <!-- RESULTS PANEL -->
  <section class="panel">
    <!-- Chip Load Gauge -->
    <div class="gauge-card">
      <div class="control-header">
        <label data-i18n="chip_load_gauge">Spanungsdicke h (Adaptive)</label>
        <span class="num" id="gaugeVal" style="font-size: 16px;">0.0 µm</span>
      </div>
      <div class="gauge-bar-wrap">
        <div class="gauge-zone-rub"></div>
        <div class="gauge-zone-cut"></div>
        <div class="gauge-zone-break"></div>
        <div class="gauge-needle" id="gaugeNeedle"></div>
      </div>

        '--border': '1px solid #e4e4e7',
        '--blur': 'none'
      }
    };

    function populateThemeSelector() {
      const select = document.getElementById('themeSelector');
      select.innerHTML = '';
      for (const [key, theme] of Object.entries(THEMES)) {
        const opt = document.createElement('option');
        opt.value = key;
        opt.textContent = theme.label;
        select.appendChild(opt);
      }
    }

    function applyTheme(themeKey) {
      triggerHaptic();
      const selectedTheme = THEMES[themeKey];
      if (!selectedTheme) return;
      
      const root = document.documentElement;
      for (const [property, value] of Object.entries(selectedTheme)) {
        if (property !== 'label') {
          root.style.setProperty(property, value);
        }
      }

      const metaTheme = document.querySelector('meta[name="theme-color"]');
      if (metaTheme && selectedTheme['--ground']) {
        metaTheme.setAttribute('content', selectedTheme['--ground']);
      }
    }

    // Material Database
    const MATERIALS = [
      { id: 'ms58', name: 'Brass MS58 (CuZn39Pb3)', vcMin: 150, vcMax: 250, ff: 1.00, noteDE: 'Kurze Späne, erste Wahl.', noteEN: 'Short chips, first choice.' },
      { id: 'ms63', name: 'Brass MS63 (CuZn37, sheet)', vcMin: 120, vcMax: 200, ff: 0.85, noteDE: 'Schmiegend, neigt zum Haken.', noteEN: 'Gummy, tends to grab.' },
      { id: 'mail', name: 'Nickel silver / Maillechort', vcMin: 80, vcMax: 140, ff: 0.60, noteDE: 'Zäher als Messing, verschmiert.', noteEN: 'Tougher than brass, smears.' },
      { id: 'cu',   name: 'Copper', vcMin: 120, vcMax: 200, ff: 0.80, noteDE: 'Sehr schmiegend, lange Späne.', noteEN: 'Very gummy, long chips.' },
      { id: 'alu',  name: 'Aluminium', vcMin: 200, vcMax: 400, ff: 1.10, noteDE: 'Aufbauschneide beachten.', noteEN: 'Watch for built-up edge.' },
      { id: 'steel',name: 'Steel (S235 / C45)', vcMin: 80, vcMax: 120, ff: 0.50, noteDE: 'Luft/Kühlmittel erforderlich.', noteEN: 'Air blast or coolant required.' },
      { id: 'ino',  name: 'Stainless (1.4301 / 304)', vcMin: 50, vcMax: 80, ff: 0.40, noteDE: 'Härtet aus wenn Vorschub zu gering.', noteEN: 'Work-hardens if feed too low.' },
      { id: 'ti',   name: 'Titanium (Gr5)', vcMin: 40, vcMax: 60, ff: 0.35, noteDE: 'Hitze bleibt im Werkzeug.', noteEN: 'Heat stays in the tool.' },
      { id: 'pom',  name: 'POM / plastics', vcMin: 200, vcMax: 500, ff: 1.30, noteDE: 'Schmilzt bei geringem Vorschub.', noteEN: 'Melts if feed too low.' }
    ];

    const PCT_Z = { 1: 0.012, 2: 0.010, 3: 0.008, 4: 0.007, 5: 0.006, 6: 0.0055, 7: 0.005, 8: 0.0045 };

    const I18N = {
      DE: {
        max_spindle: "MAX U/MIN:",
        theme_label: "Design:",
        tool_material: "Werkzeug & Werkstoff",
        presets: "Tool-Presets",
        tool_dia: "Fräserdurchmesser (D)",
        flutes: "Schneidenanzahl (Z)",
        material: "Werkstoff",
        spindle: "Spindeldrehzahl (n)",
        chip_thinning: "Spanausdünnung kompensieren",
        feature_dims: "Form-Geometrien",
        bore_dia: "Bohrung Ø (mm)",
        thread_dia: "Gewinde Ø (mm)",
        chamfer_w: "Fasenbreite (mm)",
        drill_dia: "Bohrer Ø (mm)",
        hole_depth: "Bohrtiefe (mm)",
        chip_load_gauge: "Spanungsdicke h (Adaptive)",
        milling_ops: "Fräsoperationen (CAM)",
        special_ops: "Spezialoperationen",
        op: "Op",
        param: "Parameter",
        checks: "Plausibilitätsprüfungen",
        ramp_feed: "Rampe (0.7×D, 1.5-2°)",
        plunge_feed: "Eintauchen (Plunge)",
        dec_sep: ",",
        rubbing: "Reiben (<3µm)",
        cutting: "Schneiden",
        breakage: "Bruchrisiko (>2% D)",
        all_ok: "Keine Auffälligkeiten – Werte liegen im grünen Bereich."
      },
      EN: {
        max_spindle: "MAX RPM:",
        theme_label: "Theme:",
        tool_material: "Tool & Material",
        presets: "Tool Presets",
        tool_dia: "Tool Diameter (D)",
        flutes: "Flute Count (Z)",
        material: "Material",
        spindle: "Spindle Speed (n)",
        chip_thinning: "Chip thinning compensation",
        feature_dims: "Feature Dimensions",
        bore_dia: "Bore Ø (mm)",
        thread_dia: "Thread Ø (mm)",
        chamfer_w: "Chamfer Width (mm)",
        drill_dia: "Drill Ø (mm)",
        hole_depth: "Hole Depth (mm)",
        chip_load_gauge: "Chip Thickness h (Adaptive)",
        milling_ops: "Milling Operations (CAM)",
        special_ops: "Special Operations",
        op: "Op",
        param: "Parameters",
        checks: "Plausibility Checks",
        ramp_feed: "Ramp Feed (0.7×D, 1.5-2°)",
        plunge_feed: "Plunge Feed",
        dec_sep: ".",
        rubbing: "Rubbing (<3µm)",
        cutting: "Cutting Properly",
        breakage: "Breakage Risk (>2% D)",
        all_ok: "Nothing to flag — the values sit inside the window."
      }
    };

    let lang = 'DE';
    let selectedFlutes = 2;
    let selectedMaterialIndex = 0;

    const inpMaxSpindle = document.getElementById('inp_maxSpindle');
    const inpToolDia = document.getElementById('inp_toolDia');
    const valToolDia = document.getElementById('val_toolDia');
    const matNote = document.getElementById('matNote');
    const inpSpindle = document.getElementById('inp_spindle');
    const valSpindle = document.getElementById('val_spindle');
    const spindleWarn = document.getElementById('spindleWarn');
    const inpComp = document.getElementById('inp_comp');
    const inpBore = document.getElementById('inp_bore');
    const inpThread = document.getElementById('inp_thread');
    const inpChamfer = document.getElementById('inp_chamfer');
    const inpDrill = document.getElementById('inp_drill');
    const inpDepth = document.getElementById('inp_depth');
    const langToggle = document.getElementById('langToggle');
    const copyBtn = document.getElementById('copyBtn');

    function triggerHaptic() {
      if (window.navigator && window.navigator.vibrate) {
        window.navigator.vibrate(10);
      }
    }

    // Modal Control Functions for iOS Sheet
    function openMaterialModal() {
      triggerHaptic();
      populateMaterialModal();
      document.getElementById('materialModal').classList.add('active');
    }

    function closeMaterialModal(event) {
      if (event) event.stopPropagation();
      document.getElementById('materialModal').classList.remove('active');
    }

    function populateMaterialModal() {
      const list = document.getElementById('materialOptionList');
      list.innerHTML = '';
      MATERIALS.forEach((m, idx) => {
        const item = document.createElement('div');
        item.className = `material-option-item ${idx === selectedMaterialIndex ? 'selected' : ''}`;
        item.innerHTML = `<span>${m.name}</span> ${idx === selectedMaterialIndex ? '✓' : ''}`;
        item.onclick = () => {
          triggerHaptic();
          selectedMaterialIndex = idx;
          document.getElementById('materialTriggerText').textContent = m.name;
          closeMaterialModal();
          recalc();
        };
        list.appendChild(item);
      });
    }

    langToggle.addEventListener('click', () => {
      triggerHaptic();
      lang = lang === 'DE' ? 'EN' : 'DE';
      langToggle.textContent = lang;
      updateUI();
    });

    window.applyPreset = function(dia, flutes) {
      triggerHaptic();
      inpToolDia.value = dia;
      setFlutes(flutes);
      recalc();
    };

    window.setFlutes = function(z) {
      triggerHaptic();
      selectedFlutes = z;
      document.querySelectorAll('.flute-btn').forEach((btn, idx) => {
        btn.classList.toggle('active', (idx + 1) === z);
      });
      recalc();
    };

    [inpMaxSpindle, inpToolDia, inpSpindle, inpComp, inpBore, inpThread, inpChamfer, inpDrill, inpDepth].forEach(el => {
      el.addEventListener('input', recalc);
    });

    function formatNum(num, decimals = 2) {
      const sep = I18N[lang].dec_sep;
      let str = num.toFixed(decimals);
      if (sep === ',') str = str.replace('.', ',');
      return str;
    }

    function updateUI() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (I18N[lang][key]) el.textContent = I18N[lang][key];
      });
      recalc();
    }

    function recalc() {
      // Dynamic Max Spindle Limit
      const maxSpindleLimit = Math.max(1000, parseInt(inpMaxSpindle.value) || 18000);
      inpSpindle.max = maxSpindleLimit;

      let n = parseInt(inpSpindle.value);
      if (n > maxSpindleLimit) {
        n = maxSpindleLimit;
        inpSpindle.value = n;
      }

      const D = parseFloat(inpToolDia.value);
      const z = selectedFlutes;
      const mat = MATERIALS[selectedMaterialIndex];
      const comp = inpComp.checked;

      const boreDia = parseFloat(inpBore.value) || 0;
      const threadDia = parseFloat(inpThread.value) || 0;
      const chamferW = parseFloat(inpChamfer.value) || 0;
      const drillDia = parseFloat(inpDrill.value) || 0;
      const holeDepth = parseFloat(inpDepth.value) || 0;

      // Active preset toggle state
      document.querySelectorAll('.preset-btn').forEach(btn => {
        const pDia = parseFloat(btn.getAttribute('data-dia'));
        const pZ = parseInt(btn.getAttribute('data-flutes'), 10);
        btn.classList.toggle('active', Math.abs(pDia - D) < 0.01 && pZ === z);
      });

      valToolDia.textContent = `${formatNum(D, 2)} mm`;
      valSpindle.textContent = `${n.toLocaleString()} min⁻¹`;
      matNote.textContent = lang === 'DE' ? mat.noteDE : mat.noteEN;

      // Spindle limit check
      const isAtMaxLimit = n >= maxSpindleLimit;
      if (isAtMaxLimit) {
        spindleWarn.style.display = 'block';
        spindleWarn.textContent = lang === 'DE' 
          ? `⚠️ MAX Spindellimit erreicht (${maxSpindleLimit.toLocaleString()} min⁻¹)`
          : `⚠️ MAX spindle limit reached (${maxSpindleLimit.toLocaleString()} rpm)`;
      } else {
        spindleWarn.style.display = 'none';
      }

      const fz = D * PCT_Z[z] * mat.ff;
      const vc = (Math.PI * D * n) / 1000;
      const targetVcMean = (mat.vcMin + mat.vcMax) / 2;

      let axCap = 1.0;
      if (mat.ff <= 0.4) axCap = 0.35;
      else if (mat.ff <= 0.5) axCap = 0.50;

      const opsConfig = [
        { name: 'Adaptive / Trochoidal', ae: 0.20 * D, ap: 1.00 * D, factor: 1.00 },
        { name: 'Full Slot', ae: 1.00 * D, ap: 0.45 * D, factor: 0.60 },
        { name: 'Contour (Side Wall)', ae: 0.50 * D, ap: 0.45 * D, factor: 0.75 },
        { name: 'Finishing', ae: 0.05 * D, ap: 1.00 * D, factor: 1.10 },
        { name: 'Freeing Pass (Last)', ae: 1.00 * D, ap: Math.min(0.20 * D, 0.15), factor: 0.50 },
        { name: 'Helical Interp.', ae: 0.10 * D, ap: 1.00 * D, factor: 0.45 }
      ];

      let millingHTML = '';
      let adaptiveEffectiveH = 0;
      let adaptiveFeed = 0;

      opsConfig.forEach((op, idx) => {
        const uncappedAp = op.ap;
        const ap = Math.min(uncappedAp, axCap * D);
        const ae = op.ae;

        let k = 1;
        if (ae < D / 2) {
          const r = 1 - (2 * ae / D);
          k = Math.sqrt(1 - (r * r));
        }

        const fzProg = comp ? fz / k : fz;
        const effectiveH = fzProg * k;
        const vf = n * z * fzProg * op.factor;

        if (idx === 0) {
          adaptiveEffectiveH = effectiveH;
          adaptiveFeed = vf;
        }

        millingHTML += `
          <tr>
            <td><strong>${op.name}</strong></td>
            <td class="num">${formatNum(ae, 2)}</td>
            <td class="num">${formatNum(ap, 2)}${ap < uncappedAp ? '*' : ''}</td>
            <td class="num" style="font-weight:700; color:var(--accent); font-size:14px;">${Math.round(vf)}</td>
          </tr>
        `;
      });
      document.getElementById('millingTbody').innerHTML = millingHTML;

      const rampFeed = adaptiveFeed * 0.35;
      const plungeFeed = n * z * fz * 0.12;
      document.getElementById('val_rampFeed').textContent = `${Math.round(rampFeed)} mm/min`;
      document.getElementById('val_plungeFeed').textContent = `${Math.round(plungeFeed)} mm/min`;

      const hMicrons = adaptiveEffectiveH * 1000;
      const maxMicrons = 0.03 * D * 1000;
      const gaugePercent = Math.min(100, Math.max(0, (hMicrons / maxMicrons) * 100));

      const needle = document.getElementById('gaugeNeedle');
      needle.style.left = `${gaugePercent}%`;
      document.getElementById('gaugeVal').textContent = `${formatNum(hMicrons, 1)} µm`;

      const zoneLabel = document.getElementById('gaugeZoneLabel');
      document.getElementById('gaugeMaxLabel').textContent = `${formatNum(maxMicrons, 0)} µm (3%D)`;

      if (hMicrons < 3.0) {
        zoneLabel.textContent = I18N[lang].rubbing;
        zoneLabel.style.color = 'var(--critical)';
      } else if (hMicrons > (0.02 * D * 1000)) {
        zoneLabel.textContent = I18N[lang].breakage;
        zoneLabel.style.color = 'var(--critical)';
      } else {
        zoneLabel.textContent = I18N[lang].cutting;
        zoneLabel.style.color = 'var(--ok)';
      }

      let specialHTML = '';

      // Helical Bore
      let boreFeed = 0;
      if (boreDia > D) {
        const pathDia = boreDia - D;
        const factor = pathDia / boreDia;
        const slotFeed = n * z * fz * 0.60;
        boreFeed = slotFeed * factor;
      }
      specialHTML += `
        <tr>
          <td><strong>Helical Bore</strong></td>
          <td>Bore Ø ${formatNum(boreDia, 2)} mm</td>
          <td class="num" style="font-weight:700;">${Math.round(boreFeed)}</td>
        </tr>
      `;

      // Thread Milling
      let threadFeed = 0;
      if (threadDia > D) {
        const fzThread = fz * 0.60;
        const factor = (threadDia - D) / threadDia;
        const edgeFeed = n * z * fzThread;
        threadFeed = edgeFeed * factor;
      }
      specialHTML += `
        <tr>
          <td><strong>Thread Mill</strong></td>
          <td>Thread Ø ${formatNum(threadDia, 2)} mm</td>
          <td class="num" style="font-weight:700;">${Math.round(threadFeed)}</td>
        </tr>
      `;

      // Chamfering
      const effChamferDia = D + chamferW;
      const fzCham = fz * 1.4142;
      const chamferFeed = n * z * fzCham;
      specialHTML += `
        <tr>
          <td><strong>Chamfer (45°)</strong></td>
          <td>Eff Ø ${formatNum(effChamferDia, 2)} mm</td>
          <td class="num" style="font-weight:700;">${Math.round(chamferFeed)}</td>
        </tr>
      `;

      // Drilling
      const drillVc = targetVcMean * 0.70;
      const nDrill = Math.min(maxSpindleLimit, (drillVc * 1000) / (Math.PI * drillDia));
      const feedPerRev = drillDia * 0.02 * mat.ff;
      const depthRatio = holeDepth / drillDia;
      const depthFactor = depthRatio <= 3 ? 1.00 : (depthRatio <= 5 ? 0.85 : 0.70);
      const drillFeed = nDrill * feedPerRev * depthFactor;
      specialHTML += `
        <tr>
          <td><strong>Drilling</strong></td>
          <td>${Math.round(nDrill)} min⁻¹</td>
          <td class="num" style="font-weight:700;">${Math.round(drillFeed)}</td>
        </tr>
      `;

      document.getElementById('specialTbody').innerHTML = specialHTML;

      const checks = [];

      if (hMicrons < 3.0) checks.push({ type: 'critical', text: lang === 'DE' ? 'Effektive Spanungsdicke < 3 µm: Werkzeug reibt und überhitzt.' : 'Effective chip thickness < 3 µm: tool rubs and overheats.' });
      if (fz > (0.02 * D)) checks.push({ type: 'critical', text: lang === 'DE' ? 'fz > 2% des Durchmessers: Hohes Bruchrisiko!' : 'fz > 2% of diameter: high breakage risk!' });
      if (boreDia <= D) checks.push({ type: 'critical', text: lang === 'DE' ? 'Bohrung Ø ≤ Werkzeug Ø: Helisches Einfahren unmöglich.' : 'Bore Ø ≤ tool Ø: helical entry impossible.' });
      if (D > (0.70 * threadDia)) checks.push({ type: 'critical', text: lang === 'DE' ? 'Werkzeug Ø > 70% Gewinde Ø: Gewindeprofil verzerrt.' : 'Tool Ø > 70% of thread Ø: thread profile distorts.' });

      if (vc < (mat.vcMin * 0.7)) checks.push({ type: 'warning', text: lang === 'DE' ? `Schnittgeschwindigkeit Vc (${formatNum(vc,1)} m/min) unter 70% des Zielbereichs (${mat.vcMin} m/min).` : `Cutting speed Vc (${formatNum(vc,1)} m/min) below 70% of target (${mat.vcMin} m/min).` });
      if (isAtMaxLimit) checks.push({ type: 'warning', text: lang === 'DE' ? `Drehzahl ist am eingestellten Spindellimit (${maxSpindleLimit.toLocaleString()} min⁻¹).` : `Spindle speed is at configured max limit (${maxSpindleLimit.toLocaleString()} rpm).` });
      if (boreDia < (1.15 * D) && boreDia > D) checks.push({ type: 'warning', text: lang === 'DE' ? 'Bohrung Ø < 1.15× Werkzeug Ø: Kein Spanraum; Druckluft nutzen.' : 'Bore Ø < 1.15 × tool Ø: no chip room; air into bore.' });
      if (z >= 3 && D < 0.8) checks.push({ type: 'warning', text: lang === 'DE' ? '3+ Schneiden bei Ø < 0,8 mm: Spanraummangel; 2Z bevorzugen.' : '3+ flutes below Ø0.8 mm: lack of chip room, prefer 2 flutes.' });
      if (depthRatio > 3) checks.push({ type: 'warning', text: lang === 'DE' ? 'Lochtiefe > 3×Ø: Vorschub reduziert, Entspan-Zyklen (Pecking) wählen.' : 'Hole depth > 3×Ø: feed cut to depth factor, peck in 1×Ø steps.' });
      if (axCap < 1.0) checks.push({ type: 'warning', text: lang === 'DE' ? `Werkstoff-Axialkappung aktiv (ap auf max ${axCap}×D begrenzt).` : `Material axial cap applied (ap capped to max ${axCap}×D).` });

      const checksContainer = document.getElementById('checksContainer');
      if (checks.length === 0) {
        checksContainer.innerHTML = `<div class="check-item ok">${I18N[lang].all_ok}</div>`;
      } else {
        checksContainer.innerHTML = checks.map(c => `<div class="check-item ${c.type}">${c.text}</div>`).join('');
      }

      copyBtn.onclick = () => {
        triggerHaptic();
        const copyPayload = `FEEDS & SPEEDS CALCULATOR
Configured Max Spindle: ${maxSpindleLimit.toLocaleString()} rpm
Tool: Ø${formatNum(D, 2)} mm | ${z}Z | Material: ${mat.name}
Spindle Speed: ${n} rpm | vc: ${formatNum(vc, 1)} m/min | fz: ${formatNum(fz, 4)} mm
Thinning Comp: ${comp ? 'ON' : 'OFF'}

CAM OPERATIONS:
- Adaptive: vf=${Math.round(adaptiveFeed)} mm/min (ae=${formatNum(0.2*D,2)}, ap=${formatNum(Math.min(1.0*D, axCap*D),2)})
- Ramp Feed: ${Math.round(rampFeed)} mm/min
- Plunge Feed: ${Math.round(plungeFeed)} mm/min
- Helical Bore (Ø${boreDia}mm): ${Math.round(boreFeed)} mm/min
- Thread Mill (Ø${threadDia}mm): ${Math.round(threadFeed)} mm/min
- Chamfer: ${Math.round(chamferFeed)} mm/min
- Drilling (Ø${drillDia}mm): ${Math.round(drillFeed)} mm/min (${Math.round(nDrill)} rpm)`;

        navigator.clipboard.writeText(copyPayload).then(() => {
          copyBtn.textContent = 'COPIED!';
          setTimeout(() => copyBtn.textContent = 'COPY', 1500);
        });
      };
    }

    // On Load Initialization
    populateThemeSelector();
    applyTheme('neumorphismLight');
    document.getElementById('materialTriggerText').textContent = MATERIALS[0].name;
    recalc();
  </script>
</body>
</html>
